services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: woney
      POSTGRES_PASSWORD: woney
      POSTGRES_DB: woney
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woney"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      WONEY_DATABASE_URL: postgresql+asyncpg://woney:woney@postgres:5432/woney
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
