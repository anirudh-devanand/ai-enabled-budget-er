# Render Blueprint — API + managed Postgres
# https://render.com/docs/blueprint-spec
# Connect this GitHub repo in Render Dashboard → New → Blueprint
#
# Blueprint tracks resources by the `name:` fields below. Renaming services only in
# the Render Dashboard orphans them from the Blueprint until these names match again.
# After a dashboard rename to woney-*, push this file and Manual Sync the Blueprint;
# Render adopts existing resources when `name` matches exactly.
#
# Env: code reads WONEY_* primarily and still accepts LEDGER_* as aliases.
# Env vars on the service keep working even if Blueprint-unmanaged.
# See docs/hosting-rename.md (Blueprint re-link).

databases:
  - name: woney-db
    plan: free
    # Keep Postgres role/db as created originally (ledger). Renaming the Render
    # instance display name does NOT change databaseName/user. Do not switch these
    # to woney unless you intentionally create a new empty database.
    databaseName: ledger
    user: ledger

services:
  - type: web
    name: woney-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: WONEY_ENV
        value: production
      - key: WONEY_DATABASE_URL
        fromDatabase:
          name: woney-db
          property: connectionString
      - key: WONEY_JWT_SECRET
        generateValue: true
      - key: WONEY_DATA_ENCRYPTION_KEY
        sync: false
      - key: WONEY_OPS_TOKEN
        generateValue: true
      - key: WONEY_CORS_ORIGINS
        sync: false
