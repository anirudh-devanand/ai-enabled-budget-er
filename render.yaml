# Render Blueprint — API + managed Postgres
# https://render.com/docs/blueprint-spec
# Connect this GitHub repo in Render Dashboard → New → Blueprint
#
# Existing live services named ledger-* stay until you rename them manually
# (see docs/hosting-rename.md). This file targets the Woney names for new/synced blueprints.
# Env: code reads WONEY_* primarily and still accepts LEDGER_* as aliases.

databases:
  - name: woney-db
    plan: free
    # Keep DB role/name stable for existing data; new blueprints use woney.
    databaseName: woney
    user: woney

services:
  - type: web
    name: woney-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: WONEY_ENV
        value: production
      - key: WONEY_DATABASE_URL
        fromDatabase:
          name: woney-db
          property: connectionString
      - key: WONEY_JWT_SECRET
        generateValue: true
      - key: WONEY_DATA_ENCRYPTION_KEY
        sync: false
      - key: WONEY_OPS_TOKEN
        generateValue: true
      - key: WONEY_CORS_ORIGINS
        sync: false
